<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bilancio Mediolanum 2024 · Analisi di Gruppo</title>
<script>
  // Carica i font da Bunny Fonts (drop-in di Google Fonts senza tracciamento)
  (function(){
    var l = document.createElement('link');
    l.rel = 'stylesheet';
    l.onerror = function(e){};
    l.href = 'https://fonts.bunny.net/css?family=fraunces:300,400,500,600|geist:300,400,500,600,700|geist-mono:400,500&display=swap';
    document.head.appendChild(l);
  })();
</script>
<style>
/* ============================================================
   BILANCIO MEDIOLANUM 2024 — Stylesheet
   ============================================================ */

:root {
  --ink: #0A1628;
  --ink-2: #1F2937;
  --muted: #64748B;
  --muted-2: #94A3B8;
  --line: rgba(10, 22, 40, 0.08);
  --line-strong: rgba(10, 22, 40, 0.16);
  --paper: #FAFAF7;
  --paper-2: #F5F4EE;
  --card: #FFFFFF;
  --accent: #003D7A;
  --accent-row: var(--accent);
  --accent-text: var(--accent-row);
  --pos: #047857;
  --neg: #B91C1C;
  --serif: 'Fraunces', 'Times New Roman', serif;
  --sans: 'Geist', system-ui, -apple-system, sans-serif;
  --mono: 'Geist Mono', 'SF Mono', monospace;
  --rad: 14px;
  --rad-lg: 22px;
}

[data-theme="dark"] {
  --ink: #F1F5F9;
  --ink-2: #CBD5E1;
  --muted: #94A3B8;
  --muted-2: #64748B;
  --line: rgba(255, 255, 255, 0.08);
  --line-strong: rgba(255, 255, 255, 0.18);
  --paper: #0A0F1A;
  --paper-2: #111827;
  --card: #131C2E;
  /* Lifta automaticamente il colore accent per il testo:
     mescola 45% accent-row + 55% bianco -> sempre leggibile su sfondo scuro,
     anche con accent-row impostato per-studente da PALETTE (navy/teal/emerald...). */
  --accent-text: color-mix(in oklab, var(--accent-row) 45%, white);
  --pos: #34D399;
  --neg: #F87171;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  background: var(--paper);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  font-feature-settings: 'ss01', 'cv11';
}

button { font-family: inherit; cursor: pointer; border: 0; background: none; color: inherit; }
sup { font-size: 0.5em; font-weight: 500; color: var(--muted); margin-left: 3px; vertical-align: baseline; position: relative; top: -0.05em; letter-spacing: 0; line-height: 1; }
small { font-size: 0.78em; }
em { font-style: italic; font-family: var(--serif); font-weight: 400; }

::selection { background: var(--accent); color: white; }

/* ============================================================
   APP HEADER
   ============================================================ */
.app-header {
  border-bottom: 1px solid var(--line);
  background: rgba(250, 250, 247, 0.85);
  backdrop-filter: saturate(140%) blur(12px);
  position: sticky; top: 0; z-index: 50;
}
[data-theme="dark"] .app-header { background: rgba(10, 15, 26, 0.85); }
.app-header .inner {
  max-width: 1280px; margin: 0 auto; padding: 18px 32px;
  display: flex; align-items: center; justify-content: space-between; gap: 24px;
}
.wordmark {
  display: inline-flex; align-items: center; gap: 12px;
  font-family: var(--sans); font-weight: 500;
  font-size: 13px; letter-spacing: 0.22em; text-transform: uppercase;
}
.wordmark .mark {
  width: 28px; height: 28px; border-radius: 50%;
  background: linear-gradient(135deg, var(--accent), #002952);
  position: relative; flex-shrink: 0;
  box-shadow: inset 0 -6px 12px rgba(0,0,0,0.18), 0 1px 2px rgba(0,61,122,0.25);
}
.wordmark .mark::after {
  content: ''; position: absolute; inset: 8px; border-radius: 50%;
  background: var(--paper);
}
.wordmark .name { color: var(--ink); }
.wordmark .name b { font-weight: 700; }

.app-header .meta {
  display: flex; align-items: center; gap: 18px;
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
}
.pill {
  padding: 5px 14px; border-radius: 999px;
  background: var(--ink); color: var(--paper);
  font-size: 10.5px; letter-spacing: 0.16em;
  white-space: nowrap; line-height: 1.3;
}
[data-theme="dark"] .pill { background: var(--paper); color: var(--ink); }

/* ============================================================
   HERO
   ============================================================ */
.hero {
  max-width: 1280px; margin: 0 auto;
  padding: 72px 32px 40px;
}
.eyebrow {
  display: inline-flex; align-items: center; gap: 10px;
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  margin-bottom: 28px;
}
.eyebrow .dot {
  width: 7px; height: 7px; border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(0, 61, 122, 0.15);
  animation: pulse 2.6s ease-in-out infinite;
}
@keyframes pulse {
  0%, 100% { box-shadow: 0 0 0 4px rgba(0, 61, 122, 0.15); }
  50% { box-shadow: 0 0 0 8px rgba(0, 61, 122, 0.04); }
}
.hero h1 {
  font-family: var(--serif);
  font-weight: 400;
  font-size: clamp(44px, 6vw, 88px);
  line-height: 0.98;
  letter-spacing: -0.025em;
  color: var(--ink);
  font-feature-settings: 'ss01';
  font-variation-settings: 'SOFT' 50;
}
.hero h1 em {
  font-style: italic;
  font-weight: 300;
  color: var(--muted);
}
.hero .lede {
  font-size: 17px;
  line-height: 1.6;
  color: var(--muted);
  margin-top: 32px;
  max-width: 640px;
  text-wrap: pretty;
}

/* ============================================================
   KPI BAR
   ============================================================ */
.kpi-bar {
  max-width: 1280px; margin: 32px auto 0;
  padding: 0 32px;
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.kpi-bar .cell {
  padding: 22px 24px;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 6px;
}
.kpi-bar .cell:last-child { border-right: 0; }
.kpi-bar .l {
  font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}
.kpi-bar .v {
  font-family: var(--serif);
  font-size: 32px; font-weight: 500; letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  color: var(--ink);
}
.kpi-bar .v sup { font-family: var(--sans); font-size: 12px; font-weight: 500; color: var(--muted); }

/* ============================================================
   LEGEND (LEDGER)
   ============================================================ */
.legend-section {
  max-width: 1280px;
  margin: 56px auto 80px;
  padding: 0 32px;
}
.section-head {
  display: flex; justify-content: space-between; align-items: flex-end;
  margin-bottom: 36px; gap: 32px;
  border-bottom: 1px solid var(--line);
  padding-bottom: 24px;
}
.section-head h2 {
  font-family: var(--serif);
  font-size: clamp(28px, 3.4vw, 44px);
  font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
  line-height: 1.05;
}
.section-head .sub {
  display: block;
  margin-top: 12px;
  font-size: 14.5px;
  color: var(--muted);
  max-width: 640px;
  text-wrap: pretty;
}
.section-head .right {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); text-align: right; font-weight: 500;
  font-family: var(--mono);
  white-space: nowrap;
}
.section-head .right b {
  display: inline-block; margin-top: 6px;
  color: var(--ink); font-size: 14px; letter-spacing: 0.04em;
}

.ledger {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  overflow: hidden;
}
.ledger-group + .ledger-group { border-top: 1px solid var(--line); }
.ledger-master-head {
  display: grid;
  grid-template-columns: 60px 1.7fr 1.1fr 2.2fr 1.4fr 40px;
  align-items: center;
  gap: 16px;
  padding: 18px 28px;
  font-size: 10px;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
  background: var(--paper-2);
  border-bottom: 1px solid var(--line);
}
.ledger-master-head .k {
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.ledger-divider {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 18px;
  align-items: center;
  padding: 18px 28px 14px;
  background: var(--card);
  border-bottom: 1px solid var(--line);
}
.ledger-divider .lbl {
  font-family: var(--serif);
  font-size: 13px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
.ledger-divider .line {
  height: 1px;
  background: var(--line);
}
.ledger-divider .code {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.06em;
  color: var(--muted);
  font-weight: 500;
}

.ledger-row {
  display: grid;
  grid-template-columns: 60px 1.7fr 1.1fr 2.2fr 1.4fr 40px;
  align-items: center;
  gap: 16px;
  padding: 22px 28px;
  width: 100%;
  text-align: left;
  border-bottom: 1px solid var(--line);
  position: relative;
  transition: background 0.25s ease;
  cursor: pointer;
  font-family: var(--sans);
}
.ledger-row::before {
  content: '';
  position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px;
  background: var(--accent-row);
  transform: scaleY(0);
  transform-origin: center;
  transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
}
.ledger-row:hover {
  background: linear-gradient(90deg, color-mix(in oklab, var(--accent-row) 4%, transparent), transparent 60%);
}
.ledger-row:hover::before { transform: scaleY(1); }
.ledger-row:last-child { border-bottom: 0; }

.ledger-row .num {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  letter-spacing: 0.05em;
}
.ledger-row .who {
  display: flex; flex-direction: column; gap: 4px;
  min-width: 0;
}
.ledger-row .who .name {
  font-family: var(--serif);
  font-size: 19px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.01em;
  line-height: 1.15;
}
.ledger-row .who .role {
  font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted-2); font-weight: 500;
}
.ledger-row .voce {
  display: flex; flex-direction: column; gap: 3px;
}
.ledger-row .voce b {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent-text);
  letter-spacing: 0.02em;
  font-family: var(--mono);
}
.ledger-row .voce span {
  font-size: 11.5px; color: var(--muted);
  letter-spacing: 0.02em;
}
.ledger-row .topic {
  font-size: 14px;
  color: var(--ink-2);
  line-height: 1.4;
  font-weight: 500;
  text-wrap: pretty;
}
.ledger-row .amount {
  display: flex; flex-direction: column; align-items: flex-end; gap: 6px;
  font-family: var(--mono);
  min-width: 0;
}
.ledger-row .amount .v {
  font-family: var(--serif);
  font-size: 22px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: -0.02em;
  font-variant-numeric: tabular-nums;
  line-height: 1.05;
  white-space: nowrap;
  display: inline-flex;
  align-items: baseline;
  gap: 3px;
}
.ledger-row .amount .v sup {
  font-family: var(--sans);
  font-size: 10.5px;
  position: static;
  vertical-align: baseline;
  top: 0;
  margin: 0;
  color: var(--muted);
}
.ledger-row .amount .delta {
  font-size: 10.5px;
  letter-spacing: 0.06em;
  font-weight: 500;
  font-family: var(--mono);
  white-space: nowrap;
  line-height: 1;
}
.ledger-row .amount .delta.pos { color: var(--pos); }
.ledger-row .amount .delta.neg { color: var(--neg); }
.ledger-row .amount .delta.neu { color: var(--muted); }
.ledger-row .arrow {
  font-size: 18px;
  color: var(--muted-2);
  transition: transform 0.3s ease, color 0.3s ease;
  text-align: right;
}
.ledger-row:hover .arrow {
  transform: translateX(6px);
  color: var(--accent-text);
}

.ledger-row.placeholder {
  background: repeating-linear-gradient(135deg, transparent 0, transparent 8px, var(--paper-2) 8px, var(--paper-2) 9px);
  opacity: 0.85;
}
.ledger-row.placeholder .who .name { color: var(--muted); }

.ledger-totals {
  display: grid;
  grid-template-columns: 60px 1.7fr 1.1fr 2.2fr 1.4fr 40px;
  align-items: center;
  gap: 16px;
  padding: 20px 28px;
  background: var(--ink);
  color: var(--paper);
  font-size: 11.5px; letter-spacing: 0.16em; text-transform: uppercase;
  font-weight: 600;
}
[data-theme="dark"] .ledger-totals {
  background: var(--paper-2);
  color: var(--ink);
  border-top: 1px solid var(--line-strong);
}
.ledger-totals .label { grid-column: 1 / 3; }
.ledger-totals .stat { font-family: var(--mono); letter-spacing: 0.08em; text-transform: none; font-size: 12.5px; font-weight: 500; }

/* ============================================================
   APP FOOTER
   ============================================================ */
.app-footer {
  max-width: 1280px; margin: 0 auto;
  padding: 28px 32px 56px;
  display: flex; justify-content: space-between;
  font-size: 11px; letter-spacing: 0.18em; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
  border-top: 1px solid var(--line);
}

/* ============================================================
   DETAIL OVERLAY
   ============================================================ */
.detail-overlay {
  position: fixed; inset: 0;
  background: var(--paper);
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
}
.detail-overlay.entering {
  z-index: 100;
  overflow-y: auto;
  overflow-x: hidden;
  animation: zoomIn 0.55s cubic-bezier(0.16, 1, 0.3, 1) both;
  transform-origin: var(--zoom-origin-x, 50%) var(--zoom-origin-y, 50%);
}
@keyframes zoomIn {
  0%   { opacity: 0; transform: scale(0.92); }
  100% { opacity: 1; transform: scale(1); }
}

.detail-header {
  position: sticky; top: 0; z-index: 30;
  background: rgba(250, 250, 247, 0.92);
  backdrop-filter: saturate(140%) blur(14px);
  border-bottom: 1px solid var(--line);
}
[data-theme="dark"] .detail-header { background: rgba(10, 15, 26, 0.92); }
.detail-header .inner {
  max-width: 1280px; margin: 0 auto;
  padding: 18px 32px;
  display: flex; align-items: center; justify-content: space-between;
}
.back-btn {
  display: inline-flex; align-items: center; gap: 8px;
  padding: 9px 16px 9px 12px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: 999px;
  font-size: 12px;
  font-weight: 500;
  color: var(--ink);
  letter-spacing: 0.04em;
  transition: all 0.2s ease;
}
.back-btn:hover {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
  transform: translateX(-2px);
}
.breadcrumb {
  display: flex; align-items: center; gap: 14px;
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
}
.breadcrumb b { color: var(--ink); font-weight: 600; }

/* ----- Detail Hero ----- */
.detail-hero {
  max-width: 1280px; margin: 0 auto;
  padding: 64px 32px 40px;
  position: relative;
}
.detail-hero::before {
  content: '';
  position: absolute; top: 56px; left: 32px;
  width: 56px; height: 4px;
  background: var(--accent-row);
}
.detail-hero .tag-row {
  display: flex; align-items: center; gap: 14px;
  margin-bottom: 24px;
}
.detail-hero .voce-tag {
  display: inline-flex; align-items: center;
  padding: 6px 14px;
  background: var(--accent-row);
  color: white;
  border-radius: 999px;
  font-family: var(--mono);
  font-size: 11.5px;
  font-weight: 500;
  letter-spacing: 0.06em;
}
.detail-hero .section-tag {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}
.detail-hero h1 {
  font-family: var(--serif);
  font-size: clamp(36px, 5vw, 64px);
  font-weight: 400;
  letter-spacing: -0.025em;
  line-height: 1.02;
  color: var(--ink);
  text-wrap: balance;
  font-variation-settings: 'SOFT' 50;
}
.detail-hero .student {
  display: flex; align-items: center; gap: 18px;
  margin-top: 32px;
  padding-top: 24px;
  border-top: 1px solid var(--line);
}
.detail-hero .author {
  font-size: 14px; color: var(--muted);
}
.detail-hero .author b {
  color: var(--ink); font-weight: 600;
}
.detail-hero .id-pill {
  font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.06em;
  color: var(--muted);
  padding: 4px 12px;
  border: 1px solid var(--line);
  border-radius: 999px;
}
.detail-hero .lede {
  font-size: 17.5px;
  line-height: 1.6;
  color: var(--ink-2);
  margin-top: 28px;
  max-width: 760px;
  text-wrap: pretty;
}

/* ----- Detail KPIs ----- */
.detail-kpis {
  max-width: 1280px; margin: 16px auto 56px;
  padding: 0 32px;
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 0;
  border-top: 1px solid var(--line);
  border-bottom: 1px solid var(--line);
}
.detail-kpis .cell {
  padding: 24px;
  border-right: 1px solid var(--line);
  display: flex; flex-direction: column; gap: 8px;
}
.detail-kpis .cell:last-child { border-right: 0; }
.detail-kpis .l {
  font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
}
.detail-kpis .v {
  font-family: var(--serif);
  font-size: 38px; font-weight: 500; letter-spacing: -0.025em;
  font-variant-numeric: tabular-nums;
  color: var(--accent-text);
  line-height: 1;
}
.detail-kpis .v sup { font-family: var(--sans); font-size: 13px; font-weight: 500; color: var(--muted); }

/* ============================================================
   CHAPTER
   ============================================================ */
.chapter {
  max-width: 1280px; margin: 0 auto;
  padding: 56px 32px;
  border-top: 1px solid var(--line);
}
.chapter:first-of-type { border-top: 0; }
.chapter .head {
  display: grid;
  grid-template-columns: 120px 1fr;
  gap: 32px;
  margin-bottom: 48px;
}
.chapter .num {
  font-family: var(--mono);
  font-size: 13px;
  font-weight: 500;
  color: var(--accent-text);
  letter-spacing: 0.1em;
  padding-top: 8px;
  border-top: 2px solid var(--accent-text);
  align-self: start;
}
.chapter .text { max-width: 920px; }
.chapter .kicker {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  margin-bottom: 12px;
}
.chapter .h {
  font-family: var(--serif);
  font-size: clamp(28px, 3.4vw, 44px);
  font-weight: 400;
  letter-spacing: -0.022em;
  line-height: 1.05;
  color: var(--ink);
  font-variation-settings: 'SOFT' 50;
}
.chapter .body {
  font-size: 16px;
  line-height: 1.65;
  color: var(--muted);
  margin-top: 20px;
  text-wrap: pretty;
  max-width: 760px;
}

.chapter .blocks {
  display: flex; flex-direction: column;
  gap: 24px;
}

/* ============================================================
   BLOCKS — shared cards
   ============================================================ */
.card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 32px;
}
.card h4 {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  margin-bottom: 24px;
}

/* steps4 */
.steps4 {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px;
}
.step-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad);
  padding: 24px;
  position: relative;
  transition: transform 0.3s ease, border-color 0.3s ease;
}
.step-card:hover { transform: translateY(-2px); border-color: var(--accent-text); }
.step-card .n {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.06em; color: var(--accent-text);
  font-weight: 600; margin-bottom: 14px;
}
.step-card .h {
  font-family: var(--serif); font-size: 19px; font-weight: 500;
  letter-spacing: -0.01em; line-height: 1.2; color: var(--ink);
  margin-bottom: 10px;
}
.step-card .b {
  font-size: 13px; line-height: 1.55; color: var(--muted);
}

/* callout & principle */
.callout {
  padding: 28px 32px;
  border-radius: var(--rad-lg);
  background: var(--accent-row);
  color: white;
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 28px;
  align-items: start;
}
.callout .label {
  font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
  font-weight: 700; opacity: 0.7;
  padding-top: 4px;
}
.callout .body {
  font-family: var(--serif);
  font-size: 18px; font-weight: 400;
  line-height: 1.4; letter-spacing: -0.005em;
  text-wrap: pretty;
}

.principle {
  padding: 28px 32px;
  border-radius: var(--rad-lg);
  background: var(--card);
  border: 1px solid var(--line);
  border-left: 3px solid var(--accent-text);
  display: grid;
  grid-template-columns: 140px 1fr;
  gap: 28px; align-items: start;
}
.principle .label {
  font-size: 10.5px; letter-spacing: 0.22em; text-transform: uppercase;
  font-weight: 700; color: var(--accent-text);
  padding-top: 4px;
}
.principle .body {
  font-family: var(--serif);
  font-size: 17px; font-weight: 400;
  line-height: 1.5; letter-spacing: -0.005em;
  color: var(--ink-2); text-wrap: pretty;
}

/* table */
.tbl-wrap {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 28px 32px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  /* Gradient mask sui bordi: indicazione visiva di scrollabilita' senza scrollbar invadente */
  mask-image: linear-gradient(90deg, transparent 0, black 24px, black calc(100% - 24px), transparent 100%);
  -webkit-mask-image: linear-gradient(90deg, transparent 0, black 24px, black calc(100% - 24px), transparent 100%);
}
.tbl-wrap::-webkit-scrollbar { height: 6px; }
.tbl-wrap::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 3px; }
.tbl-caption {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  margin-bottom: 18px;
}
.tbl {
  width: 100%; border-collapse: collapse;
  font-variant-numeric: tabular-nums;
  min-width: max-content;
}
.tbl th {
  text-align: left;
  font-size: 10.5px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  padding: 12px 16px 12px 0;
  border-bottom: 1px solid var(--line-strong);
}
.tbl th:not(:first-child) { text-align: right; padding-left: 16px; padding-right: 0; }
.tbl td {
  padding: 14px 16px 14px 0;
  font-size: 14px;
  border-bottom: 1px solid var(--line);
  color: var(--ink-2);
}
.tbl td:not(:first-child) {
  text-align: right;
  font-family: var(--mono);
  color: var(--ink);
  font-feature-settings: 'tnum';
  padding-left: 16px; padding-right: 0;
}
.tbl tr:last-child td { border-bottom: 0; }
.tbl tbody tr { transition: background 0.15s ease; }
.tbl tbody tr:not(.total):hover td { background: color-mix(in oklab, var(--accent-text) 5%, transparent); }
.tbl tr.total td {
  font-weight: 700;
  border-top: 2px solid var(--accent-text);
  border-bottom: 0;
  background: linear-gradient(180deg, transparent, color-mix(in oklab, var(--accent-text) 9%, transparent));
  padding-top: 18px; padding-bottom: 18px;
}
.tbl tr.total td:first-child {
  font-family: var(--sans);
  position: relative;
}
.tbl tr.total td:first-child::before {
  content: '';
  position: absolute;
  left: -12px; top: 22px; bottom: 18px;
  width: 3px;
  background: var(--accent-text);
  border-radius: 2px;
}

/* Cell type modifiers (auto-detected) */
.tbl td.cell-pos { color: var(--pos); font-weight: 600; }
.tbl td.cell-neg { color: var(--neg); font-weight: 600; }
.tbl td.cell-pos::before {
  content: '↗';
  font-family: var(--sans);
  font-size: 0.85em;
  margin-right: 6px;
  opacity: 0.85;
  vertical-align: 1px;
}
.tbl td.cell-neg::before {
  content: '↘';
  font-family: var(--sans);
  font-size: 0.85em;
  margin-right: 6px;
  opacity: 0.85;
  vertical-align: 1px;
}
.tbl td.cell-dash { color: var(--muted-2); }
.tbl td.cell-long {
  font-family: var(--sans) !important;
  font-size: 12.5px !important;
  color: var(--muted) !important;
  text-align: left !important;
  font-weight: 400 !important;
  line-height: 1.55 !important;
  font-feature-settings: normal !important;
  max-width: 320px;
  white-space: normal;
  padding-left: 20px !important;
}
.tbl td.cell-pct {
  position: relative;
  padding-bottom: 22px !important;
}
.tbl td.cell-pct .pct-val { display: inline-block; }
.tbl td.cell-pct .pct-mini {
  position: absolute;
  right: 0; bottom: 8px;
  width: 56px; height: 2.5px;
  background: var(--line-strong);
  border-radius: 2px;
  overflow: hidden;
}
.tbl td.cell-pct .pct-mini > span {
  display: block; height: 100%;
  width: var(--pct, 0%);
  background: var(--accent-text);
  border-radius: 2px;
  transition: width 0.9s cubic-bezier(0.16, 1, 0.3, 1);
}

/* donut */
.donut-block {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 40px;
  align-items: center;
}
.donut-svg { display: block; max-width: 280px; height: auto; }
.donut-svg .seg { transition: opacity 0.3s ease, stroke-width 0.3s ease; }
.donut-legend { display: flex; flex-direction: column; gap: 8px; }
.donut-legend .row {
  display: grid;
  grid-template-columns: 14px 1fr auto;
  align-items: center; gap: 14px;
  padding: 10px 0;
  border-bottom: 1px solid var(--line);
  font-size: 13.5px;
  color: var(--ink-2);
  transition: opacity 0.2s ease;
}
.donut-legend .row:last-child { border-bottom: 0; }
.donut-legend .sw {
  width: 12px; height: 12px; border-radius: 3px;
}
.donut-legend .v {
  font-family: var(--mono);
  font-weight: 500; color: var(--ink);
  font-size: 13px;
}

/* bars */
.bars-block {
  display: flex; flex-direction: column; gap: 14px;
}
.bars-block .row {
  display: grid;
  grid-template-columns: 220px 1fr auto;
  align-items: center; gap: 18px;
  padding: 6px 0;
}
.bars-block .l {
  font-size: 13.5px; color: var(--ink-2); font-weight: 500;
}
.bars-block .bar-track {
  height: 10px; background: var(--paper-2);
  border-radius: 999px; overflow: hidden;
  border: 1px solid var(--line);
}
.bars-block .bar-fill {
  display: block; height: 100%; border-radius: 999px;
  transition: width 1.1s cubic-bezier(0.16, 1, 0.3, 1);
}
.bars-block .v {
  font-family: var(--mono); font-size: 13px; font-weight: 500;
  color: var(--ink); font-variant-numeric: tabular-nums;
  text-align: right; min-width: 80px;
}
.bars-block .v small {
  display: block;
  color: var(--muted); font-size: 10.5px; letter-spacing: 0.04em; margin-top: 2px;
}

/* bars compare */
.bars-compare { display: flex; flex-direction: column; gap: 22px; }
.bars-compare .row { display: flex; flex-direction: column; gap: 8px; }
.bars-compare .lbl {
  display: flex; justify-content: space-between; align-items: baseline;
  font-size: 13.5px; color: var(--ink-2); font-weight: 500;
}
.bars-compare .vals {
  font-family: var(--mono); font-size: 11.5px; color: var(--muted);
  letter-spacing: 0.04em;
}
.bars-compare .vals b { color: var(--ink); font-weight: 600; }
.bars-compare .pair {
  display: flex; flex-direction: column; gap: 4px;
}
.bars-compare .ba, .bars-compare .bb {
  height: 8px; background: var(--paper-2);
  border-radius: 999px; overflow: hidden;
}

/* stats grid */
.stats3, .stats4 {
  display: grid; gap: 16px;
}
.stats3 { grid-template-columns: repeat(3, 1fr); }
.stats4 { grid-template-columns: repeat(4, 1fr); }
.stat-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad);
  padding: 28px 24px;
  display: flex; flex-direction: column; gap: 8px;
  transition: transform 0.3s ease, border-color 0.3s ease;
}
.stat-card:hover { transform: translateY(-2px); border-color: var(--accent-text); }
.stat-card .v {
  font-family: var(--serif);
  font-size: 38px; font-weight: 500;
  letter-spacing: -0.025em;
  color: var(--accent-text);
  font-variant-numeric: tabular-nums;
  line-height: 1;
}
.stat-card .l {
  font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase;
  color: var(--ink); font-weight: 600;
  margin-top: 4px;
}
.stat-card .s {
  font-size: 12.5px; color: var(--muted);
  margin-top: 2px;
}

/* two & three cols */
.two-cols, .three-cols { display: grid; gap: 16px; }
.two-cols { grid-template-columns: 1fr 1fr; }
.three-cols { grid-template-columns: repeat(3, 1fr); }
.two-cols .col, .three-cols .col {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad);
  padding: 24px;
}
.two-cols .h, .three-cols .h {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent-text); font-weight: 600;
  margin-bottom: 18px;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.two-cols ul, .three-cols ul {
  list-style: none; display: flex; flex-direction: column; gap: 10px;
}
.two-cols li, .three-cols li {
  font-size: 13.5px; line-height: 1.55;
  color: var(--ink-2);
  padding-left: 18px;
  position: relative;
}
.two-cols li::before, .three-cols li::before {
  content: ''; position: absolute;
  left: 0; top: 0.55em;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--accent-row);
}
.two-cols .v, .three-cols .v {
  font-family: var(--serif);
  font-size: 30px; font-weight: 500;
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 6px;
  font-variant-numeric: tabular-nums;
}
.three-cols .l {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  margin-bottom: 6px;
}

/* three drivers */
.three-drivers {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
}
.driver-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad);
  padding: 28px 24px;
  position: relative;
  overflow: hidden;
}
.driver-card::before {
  content: ''; position: absolute;
  top: 0; left: 0; right: 0; height: 3px;
  background: var(--accent-text);
}
.driver-card .n {
  font-family: var(--mono); font-size: 11px;
  letter-spacing: 0.06em; color: var(--accent-text);
  font-weight: 600; margin-bottom: 16px;
}
.driver-card .h {
  font-family: var(--serif); font-size: 22px; font-weight: 500;
  letter-spacing: -0.015em; color: var(--ink);
  margin-bottom: 12px;
  line-height: 1.15;
}
.driver-card .v {
  font-family: var(--serif);
  font-size: 26px; font-weight: 500; letter-spacing: -0.02em;
  color: var(--accent-text); margin-bottom: 10px;
  font-variant-numeric: tabular-nums;
}
.driver-card .b {
  font-size: 13.5px; line-height: 1.55; color: var(--muted);
  text-wrap: pretty;
}

/* three areas (V.40) */
.three-areas {
  display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px;
}
.area-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad);
  padding: 28px 24px;
}
.area-card .h {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--accent-text); font-weight: 700;
}
.area-card .sub {
  font-size: 12.5px; color: var(--muted);
  margin-top: 4px;
  font-style: italic; font-family: var(--serif);
}
.area-card .v {
  font-family: var(--serif); font-size: 32px; font-weight: 500;
  letter-spacing: -0.022em; color: var(--ink);
  font-variant-numeric: tabular-nums;
  margin: 16px 0 18px;
  padding-bottom: 16px;
  border-bottom: 1px solid var(--line);
}
.area-card .v sup { font-family: var(--sans); font-size: 11.5px; color: var(--muted); }
.area-card .it {
  display: flex; flex-direction: column; gap: 3px;
  padding: 12px 0;
  border-bottom: 1px solid var(--line);
}
.area-card .it:last-child { border-bottom: 0; }
.area-card .it .k {
  font-size: 11.5px; letter-spacing: 0.06em;
  color: var(--accent-text); font-weight: 600;
}
.area-card .it .vv {
  font-size: 13px; line-height: 1.5; color: var(--ink-2);
}

/* ledger4 (IFRS 9 stadi) */
.ledger4 {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px;
}
.l4-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-top: 3px solid;
  border-radius: var(--rad);
  padding: 22px;
}
.l4-card .n {
  font-family: var(--mono); font-size: 11px;
  font-weight: 600; color: var(--muted);
  letter-spacing: 0.08em; margin-bottom: 12px;
}
.l4-card .h {
  font-family: var(--serif); font-size: 18px; font-weight: 500;
  color: var(--ink); margin-bottom: 6px; letter-spacing: -0.01em;
}
.l4-card .s {
  font-size: 12.5px; color: var(--muted);
  margin-bottom: 18px; line-height: 1.5;
  padding-bottom: 14px;
  border-bottom: 1px solid var(--line);
}
.l4-card .row {
  display: flex; justify-content: space-between; gap: 8px;
  padding: 6px 0;
  font-size: 12px;
}
.l4-card .row .k {
  color: var(--muted); font-weight: 500;
  letter-spacing: 0.04em;
}
.l4-card .row .v {
  color: var(--ink); font-weight: 500;
  text-align: right;
  font-family: var(--mono); font-size: 11.5px;
}

/* ledger cases — accounting entries */
.ledger-cases { display: flex; flex-direction: column; gap: 16px; }
.lc-card {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 28px 32px;
}
.lc-card .top {
  display: flex; align-items: center; gap: 16px;
  padding-bottom: 18px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 20px;
}
.lc-card .tag {
  display: inline-flex;
  font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.06em;
  color: var(--accent-text);
  background: color-mix(in oklab, var(--accent-row) 10%, transparent);
  padding: 5px 12px; border-radius: 4px;
  font-weight: 600;
}
.lc-card .h {
  font-family: var(--serif); font-size: 22px; font-weight: 500;
  letter-spacing: -0.015em; color: var(--ink);
}
.lc-card .sub {
  font-size: 13.5px; color: var(--muted); margin-bottom: 22px;
  line-height: 1.55;
}
.lc-card .step {
  padding: 14px 0;
  border-top: 1px solid var(--line);
}
.lc-card .step:first-of-type { border-top: 0; padding-top: 0; }
.lc-card .step-h {
  display: flex; align-items: center; gap: 12px;
  margin-bottom: 8px;
}
.lc-card .nn {
  font-family: var(--mono); font-size: 11px;
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--accent-row); color: white;
  display: inline-flex; align-items: center; justify-content: center;
  font-weight: 600;
}
.lc-card .hh {
  font-size: 13.5px; font-weight: 600; color: var(--ink);
}
.lc-card .lines {
  font-family: var(--mono); font-size: 12px;
  color: var(--ink-2);
  background: var(--paper-2);
  padding: 14px 16px;
  border-radius: 8px;
  white-space: pre-line;
  line-height: 1.6;
}

/* equation (margine intermediazione) */
.equation {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 36px 32px;
  display: flex; align-items: stretch;
  gap: 16px;
  flex-wrap: nowrap;
}
.equation .term {
  flex: 1;
  display: flex; flex-direction: column; gap: 8px;
  padding: 24px;
  background: var(--paper-2);
  border-radius: var(--rad);
  border-left: 3px solid var(--muted);
}
.equation .term.eq {
  background: linear-gradient(180deg, color-mix(in oklab, var(--accent-row) 8%, transparent), color-mix(in oklab, var(--accent-row) 4%, transparent));
  border-left-color: var(--accent-text);
}
.equation .label {
  font-family: var(--mono);
  font-size: 11px; letter-spacing: 0.06em;
  color: var(--accent-text); font-weight: 600;
}
.equation .sub {
  font-size: 12.5px; color: var(--muted);
  font-weight: 500;
}
.equation .v {
  font-family: var(--serif); font-size: 36px; font-weight: 500;
  letter-spacing: -0.025em; color: var(--ink);
  font-variant-numeric: tabular-nums; line-height: 1;
  margin-top: 4px;
}
.equation .v sup { font-family: var(--sans); font-size: 12px; color: var(--muted); }
.equation .footer {
  font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--muted); font-weight: 500;
  margin-top: 6px;
}
.equation .op {
  display: flex; align-items: center; justify-content: center;
  font-family: var(--serif); font-size: 32px;
  font-weight: 400; color: var(--muted);
  width: 24px;
  flex-shrink: 0;
}

/* flow2 (SP <-> CE) */
.flow2 {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
  padding: 36px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  align-items: center; gap: 32px;
}
.flow2 .node {
  background: var(--paper-2);
  border-radius: var(--rad);
  padding: 26px 28px;
  border-top: 3px solid var(--accent-text);
}
.flow2 .node .label {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  margin-bottom: 12px;
}
.flow2 .node .h {
  font-family: var(--serif); font-size: 24px;
  font-weight: 500; color: var(--ink);
  margin-bottom: 4px; letter-spacing: -0.015em;
}
.flow2 .node .sub {
  font-size: 13px; color: var(--muted);
  margin-bottom: 18px;
}
.flow2 .node .v {
  font-family: var(--serif); font-size: 36px; font-weight: 500;
  letter-spacing: -0.025em; color: var(--accent-text);
  font-variant-numeric: tabular-nums;
}
.flow2 .node .u { font-family: var(--sans); font-size: 14px; color: var(--muted); margin-left: 4px; font-weight: 500; }
.flow2 .arr {
  display: flex; flex-direction: column; align-items: center; gap: 8px;
  color: var(--accent-text);
}
.flow2 .arr svg { width: 60px; height: 20px; }
.flow2 .arr .t {
  font-size: 10.5px; letter-spacing: 0.18em;
  text-transform: uppercase; color: var(--muted);
  font-weight: 600;
}

/* split bar */
.split-bar-wrap { padding: 28px 32px; }
.split-bar {
  display: flex; height: 56px;
  border-radius: var(--rad);
  overflow: hidden;
  margin: 12px 0 18px;
}
.split-bar .seg {
  display: flex; align-items: center; justify-content: center;
  color: white; font-size: 12px; font-weight: 600;
  letter-spacing: 0.04em;
  padding: 0 8px;
  text-align: center;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap; text-overflow: ellipsis;
}
.split-bar-wrap .legend {
  display: flex; flex-wrap: wrap; gap: 18px;
  font-size: 12.5px; color: var(--ink-2);
}
.split-bar-wrap .legend span {
  display: inline-flex; align-items: center; gap: 8px;
}
.split-bar-wrap .legend .sw {
  width: 12px; height: 12px; border-radius: 3px;
}

/* placeholder Paula */
.paula-screen {
  min-height: 80vh;
  display: flex; align-items: center; justify-content: center;
  padding: 64px 32px;
}
.paula-card {
  max-width: 520px;
  text-align: center;
  padding: 56px 40px;
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--rad-lg);
}
.paula-card .icon {
  font-size: 36px;
  margin-bottom: 24px;
  opacity: 0.4;
}
.paula-card .name {
  font-size: 11px; letter-spacing: 0.22em; text-transform: uppercase;
  color: var(--muted); font-weight: 600;
  margin-bottom: 12px;
}
.paula-card h3 {
  font-family: var(--serif);
  font-size: 36px; font-weight: 400;
  letter-spacing: -0.022em; color: var(--ink);
  margin-bottom: 20px;
}
.paula-card p {
  font-size: 15px; line-height: 1.6;
  color: var(--muted); text-wrap: pretty;
}

/* reveal animation */
.reveal {
  opacity: 0;
  transform: translateY(20px);
  transition: opacity 0.7s cubic-bezier(0.16, 1, 0.3, 1), transform 0.7s cubic-bezier(0.16, 1, 0.3, 1);
}
.reveal.in {
  opacity: 1;
  transform: translateY(0);
}

/* responsive */
@media (max-width: 1100px) {
  .kpi-bar { grid-template-columns: repeat(3, 1fr); }
  .kpi-bar .cell:nth-child(3n) { border-right: 0; }
  .ledger-master-head, .ledger-row, .ledger-totals {
    grid-template-columns: 40px 1.4fr 1fr 1.6fr 0.9fr 28px;
    padding: 18px 22px;
    gap: 12px;
  }
  .detail-kpis { grid-template-columns: repeat(2, 1fr); }
  .stats3, .stats4, .three-cols, .three-drivers, .three-areas, .ledger4 { grid-template-columns: 1fr 1fr; }
  .steps4 { grid-template-columns: repeat(2, 1fr); }
  .equation { flex-wrap: wrap; }
  .equation .op { width: 100%; padding: 4px 0; }
  .donut-block { grid-template-columns: 1fr; }
  .flow2 { grid-template-columns: 1fr; }
  .flow2 .arr { transform: rotate(90deg); padding: 16px 0; }
  .chapter .head { grid-template-columns: 1fr; }
}
@media (max-width: 720px) {
  .kpi-bar { grid-template-columns: repeat(2, 1fr); }
  .kpi-bar .cell { border-right: 1px solid var(--line) !important; }
  .kpi-bar .cell:nth-child(2n) { border-right: 0 !important; }
  .stats3, .stats4, .three-cols, .three-drivers, .three-areas, .ledger4, .two-cols, .steps4 { grid-template-columns: 1fr; }
  .ledger-master-head { display: none; }
  .ledger-row {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 22px;
  }
  .ledger-row .arrow { display: none; }
  .detail-kpis { grid-template-columns: 1fr 1fr; }
  .callout, .principle { grid-template-columns: 1fr; }
}

/* ============================================================
   SCROLL PROGRESS BAR
   ============================================================ */
.scroll-progress {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: 2px;
  background: var(--accent);
  transform-origin: 0 0;
  transform: scaleX(0);
  z-index: 1000;
  pointer-events: none;
  transition: transform 0.08s linear;
  box-shadow: 0 0 8px color-mix(in oklab, var(--accent) 60%, transparent);
}

/* HERO — source line */
.hero-source {
  margin-top: 16px;
  font-size: 11.5px;
  letter-spacing: 0.04em;
  color: var(--muted-2);
  font-family: var(--mono);
  max-width: 640px;
}

/* ============================================================
   COMMAND PALETTE
   ============================================================ */
.cmd-trigger {
  position: fixed;
  bottom: 24px;
  right: 24px;
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px 10px 12px;
  border-radius: 999px;
  background: var(--ink);
  color: var(--paper);
  font-size: 12px;
  font-weight: 500;
  letter-spacing: 0.04em;
  border: 1px solid var(--line-strong);
  box-shadow: 0 12px 32px -10px rgba(10, 22, 40, 0.4), 0 2px 8px rgba(10, 22, 40, 0.12);
  z-index: 90;
  transition: transform 0.25s ease, box-shadow 0.25s ease;
}
.cmd-trigger:hover {
  transform: translateY(-2px);
  box-shadow: 0 18px 40px -10px rgba(10, 22, 40, 0.5), 0 4px 12px rgba(10, 22, 40, 0.18);
}
[data-theme="dark"] .cmd-trigger {
  background: var(--paper-2);
  color: var(--ink);
}
.cmd-trigger .ico {
  font-size: 14px;
  font-weight: 600;
  width: 22px; height: 22px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 50%;
  background: color-mix(in oklab, var(--paper) 15%, transparent);
}
[data-theme="dark"] .cmd-trigger .ico { background: color-mix(in oklab, var(--ink) 15%, transparent); }
.cmd-trigger .lbl { font-family: var(--sans); }
.cmd-trigger .kbd {
  font-family: var(--mono);
  font-size: 10.5px;
  padding: 3px 7px;
  border-radius: 6px;
  background: color-mix(in oklab, var(--paper) 18%, transparent);
  letter-spacing: 0.04em;
  margin-left: 4px;
}
[data-theme="dark"] .cmd-trigger .kbd { background: color-mix(in oklab, var(--ink) 18%, transparent); }

.cmd-backdrop {
  position: fixed;
  inset: 0;
  background: color-mix(in oklab, var(--ink) 60%, transparent);
  backdrop-filter: blur(6px);
  z-index: 200;
  display: flex;
  align-items: flex-start;
  justify-content: center;
  padding-top: 14vh;
  animation: fadeIn 0.18s ease;
}
@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

.cmd-panel {
  width: min(640px, 92vw);
  background: var(--card);
  border: 1px solid var(--line-strong);
  border-radius: 14px;
  box-shadow: 0 32px 80px -20px rgba(10, 22, 40, 0.5), 0 8px 24px rgba(10, 22, 40, 0.2);
  overflow: hidden;
  animation: cmdIn 0.22s cubic-bezier(0.2, 0.9, 0.3, 1.2);
}
@keyframes cmdIn {
  from { transform: translateY(-12px) scale(0.97); opacity: 0; }
  to { transform: translateY(0) scale(1); opacity: 1; }
}

.cmd-input-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 16px 18px;
  border-bottom: 1px solid var(--line);
}
.cmd-prompt {
  font-family: var(--mono);
  font-size: 18px;
  color: var(--accent-text);
  font-weight: 600;
}
.cmd-input {
  flex: 1;
  border: 0;
  outline: 0;
  background: none;
  color: var(--ink);
  font-family: var(--sans);
  font-size: 16px;
}
.cmd-input::placeholder { color: var(--muted-2); }
.cmd-esc {
  font-family: var(--mono);
  font-size: 10.5px;
  color: var(--muted);
  padding: 3px 8px;
  border: 1px solid var(--line);
  border-radius: 5px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.cmd-results {
  max-height: 50vh;
  overflow-y: auto;
  padding: 6px;
}
.cmd-empty {
  padding: 32px 20px;
  text-align: center;
  font-size: 13px;
  color: var(--muted);
}
.cmd-item {
  width: 100%;
  display: grid;
  grid-template-columns: 36px 1fr auto;
  align-items: center;
  gap: 14px;
  padding: 10px 14px;
  text-align: left;
  border-radius: 8px;
  transition: background 0.12s ease;
  border: 0;
  background: none;
  cursor: pointer;
}
.cmd-item.sel {
  background: color-mix(in oklab, var(--accent-row) 10%, transparent);
}
.cmd-item.sel .cmd-arrow { color: var(--accent-text); transform: translateX(2px); }
.cmd-n {
  font-family: var(--mono);
  font-size: 11px;
  color: var(--accent-text);
  font-weight: 600;
  letter-spacing: 0.05em;
  width: 32px;
  height: 32px;
  display: inline-flex; align-items: center; justify-content: center;
  border-radius: 8px;
  background: color-mix(in oklab, var(--accent-row) 12%, transparent);
}
.cmd-body {
  display: flex; flex-direction: column; gap: 2px;
  min-width: 0;
}
.cmd-title {
  font-size: 14.5px;
  font-weight: 500;
  color: var(--ink);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.cmd-meta {
  font-size: 11px;
  letter-spacing: 0.04em;
  color: var(--muted);
}
.cmd-arrow {
  font-size: 14px;
  color: var(--muted-2);
  transition: transform 0.15s ease, color 0.15s ease;
}

.cmd-footer {
  display: flex;
  gap: 16px;
  padding: 10px 18px;
  border-top: 1px solid var(--line);
  background: var(--paper-2);
  font-size: 10.5px;
  color: var(--muted);
}
.cmd-footer kbd {
  display: inline-block;
  font-family: var(--mono);
  font-size: 10px;
  padding: 1px 5px;
  margin-right: 4px;
  border: 1px solid var(--line);
  border-radius: 4px;
  background: var(--card);
  color: var(--ink-2);
}

@media (max-width: 720px) {
  .cmd-trigger .lbl { display: none; }
  .cmd-trigger { padding: 10px; }
}

/* ============================================================
   DESIGN POLISH — animazioni e micro-interazioni
   ============================================================ */

/* Stagger entrance animation per le card dentro blocchi multi-colonna.
   Si attivano dopo che il parent .reveal entra in viewport. */
@keyframes cardEnter {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: translateY(0); }
}
.reveal.in :is(.three-drivers, .three-cols, .three-areas, .steps4, .stats3, .stats4, .ledger4, .ledger-cases) > * {
  animation: cardEnter 0.55s cubic-bezier(0.16, 1, 0.3, 1) backwards;
  animation-delay: 80ms;
}
.reveal.in :is(.three-drivers, .three-cols, .three-areas, .steps4, .stats3, .stats4, .ledger4, .ledger-cases) > *:nth-child(2) { animation-delay: 160ms; }
.reveal.in :is(.three-drivers, .three-cols, .three-areas, .steps4, .stats3, .stats4, .ledger4, .ledger-cases) > *:nth-child(3) { animation-delay: 240ms; }
.reveal.in :is(.three-drivers, .three-cols, .three-areas, .steps4, .stats3, .stats4, .ledger4, .ledger-cases) > *:nth-child(4) { animation-delay: 320ms; }
.reveal.in :is(.three-drivers, .three-cols, .three-areas, .steps4, .stats3, .stats4, .ledger4, .ledger-cases) > *:nth-child(5) { animation-delay: 400ms; }
.reveal.in :is(.three-drivers, .three-cols, .three-areas, .steps4, .stats3, .stats4, .ledger4, .ledger-cases) > *:nth-child(6) { animation-delay: 480ms; }
.reveal.in :is(.three-drivers, .three-cols, .three-areas, .steps4, .stats3, .stats4, .ledger4, .ledger-cases) > *:nth-child(7) { animation-delay: 560ms; }

/* Hover lift uniforme su TUTTE le card (area-card, driver-card, l4-card, lc-card). */
.area-card, .driver-card, .l4-card, .lc-card {
  transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
}
.area-card:hover, .driver-card:hover, .l4-card:hover, .lc-card:hover {
  transform: translateY(-2px);
  border-color: color-mix(in oklab, var(--accent-text) 50%, var(--line));
  box-shadow: 0 10px 28px -10px color-mix(in oklab, var(--accent-row) 24%, transparent);
}

/* Soft glow shadow anche sulle card che gia' avevano hover (step-card, stat-card). */
.step-card:hover, .stat-card:hover {
  box-shadow: 0 10px 28px -10px color-mix(in oklab, var(--accent-row) 24%, transparent);
}

/* Chapter divider piu' raffinato: punto accent al centro del confine fra capitoli.
   I .chapter sono incapsulati ciascuno in un .reveal, quindi target via sibling. */
.reveal + .reveal > .chapter { position: relative; }
.reveal + .reveal > .chapter::before {
  content: '';
  position: absolute;
  top: -4.5px;
  left: 50%;
  transform: translateX(-50%);
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: var(--accent-text);
  box-shadow: 0 0 0 4px var(--paper);
}

/* Donut: anima i segmenti quando entrano in viewport (gestito via classe .donut-anim). */
.donut-svg .seg {
  transition: opacity 0.3s ease, stroke-width 0.3s ease, stroke-dasharray 0.95s cubic-bezier(0.16, 1, 0.3, 1);
}

/* Slight serif italic nel chapter kicker per una nota editoriale piu' viva. */
.chapter .kicker em { font-family: var(--serif); font-weight: 400; }
